{% extends 'base.html' %}

{% block title %}Register - TaskBridge{% endblock %}

{% block content %}
<div class="auth-wrapper" id="register-wrapper">
    <div class="auth-card" id="register-card">
        <h2 class="auth-title">Create Account</h2>
        <form action="{{ url_for('auth.register') }}" method="POST" id="register-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="yourname@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Choose a password" required autocomplete="new-password" style="padding-right: 2.5rem;">
                    <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 12px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; outline: none; line-height: 1;">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="register-submit">Register</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('auth.login') }}" id="link-login">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
