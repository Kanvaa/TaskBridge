{% extends 'base.html' %}

{% block title %}Login - TaskBridge{% endblock %}

{% block content %}
<div class="auth-wrapper" id="login-wrapper">
    <div class="auth-card" id="login-card">
        <h2 class="auth-title">Sign In</h2>
        <form action="{{ url_for('auth.login') }}" method="POST" id="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" required autocomplete="current-password" style="padding-right: 2.5rem;">
                    <button type="button" onclick="togglePassword('password', this)" style="position: absolute; right: 12px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1.1rem; outline: none; line-height: 1;">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="login-submit">Login</button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}" id="link-register">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
